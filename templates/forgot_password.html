<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> -->

    <title>Forgot Password | Virtual Email Assistant</title>
    <meta name="description" content="Reset your Virtual Email Assistant account password.">

    <style>
        :root {
            --bg-1: #2b2f4e;
            --bg-2: #4a4f72;
            --card-bg: #ffffff;
            --muted: #6b7280;
            --accent: #2b2f4e;
            --danger: #ff4d4d;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(11, 14, 25, 0.18);

            --s-xxs: 0.25rem;
            --s-xs: 0.5rem;
            --s-sm: 0.75rem;
            --s-md: 1rem;
            --s-lg: 1.5rem;
            --s-xl: 2rem;

            font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            padding: var(--s-xl);
        }

        .forgot-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: calc(var(--s-lg) + 0.5rem);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: var(--s-md);
            animation: enter 360ms cubic-bezier(.2, .9, .3, 1);
        }

        @keyframes enter {
            from {
                transform: translateY(8px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .brand {
            display: flex;
            gap: var(--s-sm);
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 60px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #3a3f66, #5a5f8a);
            display: inline-grid;
            place-items: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 6px 18px rgba(10, 12, 30, 0.12);
        }

        h1 {
            margin: 0;
            font-size: 1.125rem;
            color: var(--bg-1);
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: var(--s-md);
        }

        label {
            font-size: 0.825rem;
            color: #374151;
            margin-bottom: var(--s-xxs);
            font-weight: 600;
        }

        input[type="email"] {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 1px solid #e6e9ef;
            background: #fff;
            height: 44px;
            transition: box-shadow .18s ease, border-color .18s ease;
        }

        input:focus {
            outline: none;
            border-color: rgba(43, 47, 78, 0.9);
            box-shadow: 0 6px 18px rgba(43, 47, 78, 0.08);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(180deg, var(--accent), #22243a);
            color: #fff;
            box-shadow: 0 8px 22px rgba(11, 14, 25, 0.12);
            transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        button[type="submit"]:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(11, 14, 25, 0.18);
            opacity: 0.95;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .footer a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width:420px) {
            .forgot-card {
                padding: 1rem;
                border-radius: 10px;
            }

            h1 {
                font-size: 1rem;
            }

            .logo {
                width: 40px;
                height: 40px;
            }
        }

        .alert-message {
            padding: 12px 18px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .alert-message:empty {
            display: none;
        }

        /* Success style */
        .alert-message:has(.success),
        .alert-message.success {
            background: #e6ffed;
            color: #1e7d34;
            border: 1px solid #b6e9c8;
        }

        /* Error style */
        .alert-message:has(.error),
        .alert-message.error {
            background: #ffe6e6;
            color: #a72828;
            border: 1px solid #e9b6b6;
        }

        /* Info style */
        .alert-message:has(.info),
        .alert-message.info {
            background: #e6f0ff;
            color: #204d94;
            border: 1px solid #b6c9e9;
        }

        /* Smooth fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="forgot-card" role="main" aria-labelledby="forgot-heading">
        <div class="brand">
            <div class="logo" aria-hidden="true">VEXA</div>
        </div>
        <header>
            <h1 id="forgot-heading">Forgot Password</h1>
            <p class="subtitle">Enter your registered email to reset your password</p>
        </header>
        {% if message %}
        <div class="alert-message 
    {% if '✅' in message %}success{% elif '❌' in message %}error{% else %}info{% endif %}">
            {{ message|safe }}
        </div>
        {% endif %}

        <form method="POST">
            <label for="email">Registered Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <div class="footer">
            <a href="/login">⬅ Back to Login</a>
        </div>
    </main>
</body>

</html>
